name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to production server
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.PRODUCTION_SERVER_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SERVER_PORT }}
          script: |
            cd /path/to/your/app
            git pull origin main  # コードをサーバーに引き込む
            docker-compose down   # 既存コンテナを停止
            docker-compose build  # サーバー上でイメージをビルド
            docker-compose up -d  # 新しいイメージでコンテナを起動
